name: CI

on:
  push:
    branches:
      - main
      - bootstrap/platform-foundation
      - "agent/**"
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run agent:dry-run -- --issue=5
